        </header>
        
        <br><br><br><br><br><br><br>

    <div class="container">
        <h2 class="main-title">Check Out</h2>
        
        <form action="#">
            <section class="billing-details">
                <h3 class="section-title">Billing Details</h3>
                
                <div class="row">
                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" required>
                    </div>
                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Street Address</label>
                    <input type="text" required>
                </div>

                <div class="input-group">
                    <label>Town / City</label>
                    <input type="text" required>
                </div>

                <div class="input-group">
                    <label>Country</label>
                    <select required>
                         <option value="" disabled selected hidden>Choose Country</option>
                        <option value="egypt">Egypt</option>
                        <option value="saudi">The Saudi Arabia</option>
                        <option value="uae">The Emirates</option>
                        <option value="kuwait">Kuwait</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Phone</label>
                    <input type="tel" placeholder="01XXXXXXXXX" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="user@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>Order Notes (Optional)</label>
                    <textarea rows="4"></textarea>
                </div>
            </section>

            <section class="payment-methods">
                <h3 class="section-title">Payment</h3>
                
                <div class="payment-option">
                    <input type="radio" id="online" name="payment_method" required>
                    <label for="online">Online Payment</label>
                    
                    <div class="sub-options">
                        <input type="radio" id="visa" name="online_type">
                        <label for="visa">Visa</label>
                        
                        <input type="radio" id="vodafone" name="online_type">
                        <label for="vodafone">Vodafone Cash</label>
                    </div>
                </div>

                <div class="payment-option">
                    <input type="radio" id="cash" name="payment_method" required>
                    <label for="cash">Cash on Delivery</label>
                </div>

                <button type="submit" class="place-order-btn">PLACE ORDER</button>
            </section>
        </form>
    </div>
